# systemd-boot profile — Arch Linux (Hardened)
# Kernel: linux-hardened
# Use: malware analysis, security testing. High-risk browsing goes in an
#      isolated Whonix VM under the Vfio profile, not here.
#
# Minimal attack surface: no GPU passthrough, no proprietary drivers loaded.
# The dedicated GPU is left alone; the host runs on the Intel iGPU.
# This is the everyday secure-default profile.
#
# FORMAT NOTE: loader entries are strict "key value" lines — there is NO
# backslash line continuation in this format. Multiple `options` lines are
# concatenated in order by the loader (Boot Loader Specification), which is
# what keeps these readable. See problems/boot-entries-backslash-continuation.md

title   Arch Linux (Hardened)
linux   /vmlinuz-linux-hardened
initrd  /initramfs-linux-hardened.img
# LUKS container UUID (from: cryptsetup luksUUID /dev/nvme0n1pX) — NOT the GPT PARTUUID
options rd.luks.name=YOUR-LUKS-UUID-HERE=cryptroot root=/dev/mapper/cryptroot rw rootfstype=btrfs rootflags=subvol=@ zswap.enabled=0
options modprobe.blacklist=nouveau,nvidia,nvidia_drm,nvidia_modeset nvidia-drm.modeset=0
options lockdown=confidentiality lsm=landlock,lockdown,yama,bpf

# Replace YOUR-LUKS-UUID-HERE with your actual LUKS container UUID
# To find it: cryptsetup luksUUID /dev/nvme0n1pX   (the LUKS partition, e.g. ...p2)
#
# Root device matches what arch-bootstrap produces: it opens the LUKS
# container as `cryptroot` and puts the system on the @ subvolume, so
# `rootflags=subvol=@` is REQUIRED. Without it the kernel mounts the Btrfs
# top-level (subvolid=5) instead of @ — a system that contains @, @home, …
# as folders instead of the real root, and boots wrong.
#
# Key parameters explained:
#   lockdown=confidentiality  — kernel lockdown, strictest mode: blocks paths
#                               that could leak or alter kernel memory
#   lsm=landlock,lockdown,yama,bpf  — explicit Linux Security Modules stack
#                               (note: an explicit lsm= REPLACES the built-in
#                               default list — 'integrity' is deliberately out)
#   modprobe.blacklist NVIDIA stack  — no proprietary GPU code on a security box
#
# NOTE: lockdown=confidentiality can prevent loading unsigned out-of-tree
# modules. It pairs well with Secure Boot + signed modules (see arch-bootstrap).
