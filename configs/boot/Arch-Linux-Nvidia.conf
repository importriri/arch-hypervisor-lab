# systemd-boot profile — Arch Linux (Nvidia)
# Kernel: linux-hardened
# Use: native Linux gaming, rendering, Blender. Proprietary NVIDIA driver on host.
#
# Here the RTX 3070 IS used by the host (opposite of the Vfio profile).
# nouveau is blacklisted so the proprietary nvidia module can take the card.
#
# FORMAT NOTE: loader entries are strict "key value" lines — there is NO
# backslash line continuation in this format. Multiple `options` lines are
# concatenated in order by the loader (Boot Loader Specification).
# See problems/boot-entries-backslash-continuation.md

title   Arch Linux (Nvidia)
linux   /vmlinuz-linux-hardened
initrd  /initramfs-linux-hardened.img
# LUKS container UUID (from: cryptsetup luksUUID /dev/nvme0n1pX) — NOT the GPT PARTUUID
options rd.luks.name=YOUR-LUKS-UUID-HERE=root root=/dev/mapper/root rw rootfstype=btrfs zswap.enabled=0
options nvidia-drm.modeset=1 modprobe.blacklist=nouveau

# Replace YOUR-LUKS-UUID-HERE with your actual LUKS container UUID
# To find it: cryptsetup luksUUID /dev/nvme0n1pX   (the LUKS partition, e.g. ...p2)
#
# Key parameters explained:
#   nvidia-drm.modeset=1  — enables NVIDIA DRM modesetting (needed for Wayland
#                           and proper native output on the dGPU)
#   modprobe.blacklist=nouveau — blocks the open driver (rd.driver.blacklist is
#                           dracut-only, inert on mkinitcpio) so the proprietary
#                           nvidia module owns the card
#
# NOTE: requires the nvidia-dkms (or nvidia) package installed on the host.
# This profile does NOT set intel_iommu: it is for host use, not passthrough.
