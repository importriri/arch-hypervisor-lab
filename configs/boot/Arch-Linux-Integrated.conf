# systemd-boot profile — Arch Linux (Integrated)
# Kernel: linux-hardened
# Use: light work, battery saving. Intel iGPU only, NVIDIA fully powered down.
#
# The dedicated GPU is not driven by any host driver here. Combined with the
# udev/bbswitch power-off rule it stays cold, which is the big battery win on
# this laptop.
#
# FORMAT NOTE: loader entries are strict "key value" lines — there is NO
# backslash line continuation in this format. Multiple `options` lines are
# concatenated in order by the loader (Boot Loader Specification).
# See problems/boot-entries-backslash-continuation.md

title   Arch Linux (Integrated)
linux   /vmlinuz-linux-hardened
initrd  /initramfs-linux-hardened.img
# LUKS container UUID (from: cryptsetup luksUUID /dev/nvme0n1pX) — NOT the GPT PARTUUID
options rd.luks.name=YOUR-LUKS-UUID-HERE=root root=/dev/mapper/root rw rootfstype=btrfs zswap.enabled=0
options i915.enable_guc=2
options modprobe.blacklist=nouveau,nvidia,nvidia_drm,nvidia_modeset nvidia-drm.modeset=0

# Replace YOUR-LUKS-UUID-HERE with your actual LUKS container UUID
# To find it: cryptsetup luksUUID /dev/nvme0n1pX   (the LUKS partition, e.g. ...p2)
#
# Key parameters explained:
#   i915.enable_guc=2  — enables GuC/HuC firmware load on the Intel iGPU
#                        (better power management and media offload)
#   modprobe.blacklist=nouveau,nvidia,...  — keeps every NVIDIA driver off the
#                        host so the dGPU can stay powered down
#   nvidia-drm.modeset=0  — no NVIDIA modesetting on this profile
